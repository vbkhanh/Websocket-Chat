
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: websocket-chat-namespaces
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vbkhanh/Websocket-Chat.git
    targetRevision: main
    path: argocd/namespaces
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
