
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: websocket-chat-project
  namespace: argocd
spec:
  description: WebSocket Chat application
  sourceRepos:
    - "*"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: websocket-chat-app
    - server: https://kubernetes.default.svc
      namespace: default
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
