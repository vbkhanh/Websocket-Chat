version: '3.9'

name: websocket-chat

services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env

  db:
    image: postgres:latest
    restart: "always"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  redis:
    image: redis:7
    restart: "always"
    ports:
      - "6379:6379"
    volumes:
      - ./tmp/rd:/data

  adminer:
    image: adminer:4.8.1
    restart: "always"
    ports:
      - "8765:8080"
    depends_on:
      - db
  
volumes:
  postgres_data: