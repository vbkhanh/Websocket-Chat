name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # - name: Run tests
      #   run: |
      #     docker compose \
      #       -f docker-compose.yaml \
      #       -f docker-compose.test.yaml \
      #       run --rm app pytest
      - name: Start test environment
        run: |
          docker compose \
            -f docker-compose.yaml \
            -f docker-compose.test.yaml \
            up -d

      - name: Run tests
        run: |
          docker compose \
            -f docker-compose.yaml \
            -f docker-compose.test.yaml \
            exec -T app pytest -v


      - name: Cleanup
        if: always()
        run: |
          docker compose \
            -f docker-compose.yaml \
            -f docker-compose.test.yaml \
            down -v