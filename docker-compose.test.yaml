services:
  app:
    ports: !reset []
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: test_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 1
    env_file: !reset []

  db:
    ports: !reset []
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_db
    env_file: !reset []
    # tmpfs speeds up CI runs and guarantees a clean db each time
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    ports: !reset []
    env_file: !reset []

  adminer:
    profiles: ["dev-only"]  # excluded by default; not needed in CI